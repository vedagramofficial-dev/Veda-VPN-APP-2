name: Extract VEDA VPN ZIP

on:
  push:
    paths:
      - "incoming/*.zip"
      - "incoming/**/*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y unzip rsync

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find incoming -type f -name '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found in incoming/"
            exit 1
          fi

          mkdir -p /tmp/veda-extract
          unzip -oq "$ZIP_FILE" -d /tmp/veda-extract

          SOURCE="/tmp/veda-extract"
          COUNT="$(find "$SOURCE" -mindepth 1 -maxdepth 1 | wc -l)"

          if [ "$COUNT" -eq 1 ] && [ -d "$(find "$SOURCE" -mindepth 1 -maxdepth 1 -type d | head -n 1)" ]; then
            SOURCE="$(find "$SOURCE" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          fi

          rsync -av "$SOURCE/" ./ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='incoming/'

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- . ':!incoming' ':!.github'

          if ! git diff --cached --quiet; then
            git commit -m "Extract VEDA VPN project ZIP"
            git push
          else
            echo "No project changes to commit."
          fi
